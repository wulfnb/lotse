<!doctype html><meta charset="utf-8"><title>Lotse native interaction fixture</title>
<style>body{font:18px system-ui;max-width:900px;margin:30px auto;padding:20px}button,input,select,textarea{font:inherit;padding:10px;margin:8px}section{border:1px solid #aaa;padding:16px;margin:12px 0}output{display:block;white-space:pre-wrap}</style>
<h1>Native interaction fixture</h1><p>Disposable local test data only.</p>
<section><label for="typing">Keyboard input</label><input id="typing" oninput="typed.textContent=this.value"><output id="typed">No input yet</output><textarea aria-label="Multiline keyboard input">Editable text</textarea></section>
<section><button onclick="alert('Native alert fixture')">Show alert</button><button onclick="result.textContent=String(confirm('Native confirm fixture'))">Show confirm</button><button onclick="result.textContent=String(prompt('Native prompt fixture','Default value'))">Show prompt</button><output id="result">No decision yet</output></section>
<section><label for="single">Single text file</label><input id="single" type="file" accept=".txt" onchange="files.textContent=this.files[0]?.name||'No file'"><br><label for="multiple">Multiple text files</label><input id="multiple" type="file" accept=".txt" multiple onchange="files.textContent=Array.from(this.files,f=>f.name).join(', ')"><output id="files">No file selected</output></section>
<section><label for="choice">Choice</label><select id="choice"><optgroup label="Letters"><option>Alpha</option><option>Beta</option><option disabled>Unavailable</option></optgroup></select><label for="color">Color</label><input id="color" type="color" value="#123456"></section>
<section><a href="/second.html" target="_blank">Open second tab</a> · <a href="/manual-data.txt" download="coverage-download.txt">Download fixture text</a> · <a href="mailto:fixture@example.invalid">External protocol confirmation</a></section>
