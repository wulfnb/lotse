services:
  servo-browser:
    image: servo-browser:local
    build:
      context: .
      args:
        BUILD_PROFILE: ${SERVO_BUILD_PROFILE:-release}
        BUILD_JOBS: ${SERVO_BUILD_JOBS:-2}
    ports:
      - "${SERVO_BIND_ADDRESS:-127.0.0.1}:${SERVO_PORT:-7443}:7443"
    environment:
      BROWSER_RESOLUTION: ${SERVO_RESOLUTION:-1440x900}
      BROWSER_START_URL: ${SERVO_START_URL:-about:blank}
      BROWSER_USER: ${SERVO_WEB_USER:-servo}
      BROWSER_PASSWORD: ${SERVO_WEB_PASSWORD:-}
    volumes:
      - servo-profile:/config
      - ${SERVO_DOWNLOAD_DIR:-./downloads}:/config/Downloads
    shm_size: 512mb
    init: false # tini is already the image entrypoint
    restart: unless-stopped
    stop_grace_period: 20s
volumes:
  servo-profile:
