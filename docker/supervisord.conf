[unix_http_server]
file=/run/servo/supervisor.sock
chmod=0700
[supervisord]
user=root
nodaemon=true
pidfile=/run/servo/supervisord.pid
logfile=/dev/null
childlogdir=/run/servo
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///run/servo/supervisor.sock
[program:display]
command=/usr/sbin/gosu browser /usr/bin/Xvfb :99 -screen 0 %(ENV_BROWSER_RESOLUTION)sx24 -nolisten tcp -ac
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:windows]
command=/usr/sbin/gosu browser /bin/sh -c 'until xdpyinfo >/dev/null 2>&1; do sleep 0.2; done; exec openbox --config-file /etc/servo-openbox.xml'
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:vnc]
command=/usr/sbin/gosu browser /usr/bin/x11vnc -display :99 -rfbport 5900 -localhost -nopw -forever -shared -noxdamage -wait 33 -defer 15 -repeat -quiet -xkb
priority=20
autorestart=true
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:websocket]
stopasgroup=true
killasgroup=true
command=/usr/sbin/gosu browser /usr/bin/python3 /opt/servo/auth-service.py
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:web]
command=/usr/sbin/gosu browser /usr/sbin/nginx -e stderr -g 'daemon off;'
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:browser]
command=/usr/sbin/gosu browser /usr/local/bin/start-browser.sh
priority=40
autorestart=true
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
