[unix_http_server]
file=/run/wega/browser/supervisor.sock
chmod=0700
[supervisord]
user=root
nodaemon=true
pidfile=/run/wega/browser/supervisord.pid
logfile=/dev/null
childlogdir=/run/wega/browser
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///run/wega/browser/supervisor.sock
[program:display]
command=/usr/sbin/gosu browser /usr/bin/Xvfb :99 -screen 0 %(ENV_BROWSER_RESOLUTION)sx24 -nolisten tcp -ac
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:windows]
command=/usr/sbin/gosu browser /bin/sh -c 'until xdpyinfo >/dev/null 2>&1; do sleep 0.2; done; exec openbox --config-file /etc/wega-openbox.xml'
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:vnc]
; No TCP port at all: pages in the container can reach loopback TCP, so the
; password-less RFB server listens only on a Unix socket in a directory that the
; wega-ipc group (websockify) can traverse. LibVNCServer opens [::]:5900 even
; with -rfbport 0 -noipv6; only -rfbportv6 -1 disables that listener.
; -noremote and -nocmds stop X clients from reconfiguring x11vnc or launching
; commands.
command=/usr/sbin/gosu browser /bin/sh -c 'exec /usr/bin/x11vnc -display :99 -rfbport 0 -rfbportv6 -1 -noipv6 -unixsock /run/wega/vnc/rfb.sock -noremote -nocmds -nopw -forever -shared -noxdamage -wait "${WEGA_VNC_WAIT:-50}" -defer 15 -repeat -quiet -xkb'
umask=007
priority=20
autorestart=true
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:websocket]
stopasgroup=true
killasgroup=true
; Own UID: the browser UID cannot read the account key or credential record.
command=/usr/sbin/gosu wega-auth /usr/bin/python3 -I /opt/wega/auth-service.py
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:web]
command=/usr/sbin/gosu browser /usr/sbin/nginx -e stderr -g 'daemon off;'
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:browser]
command=/usr/sbin/gosu browser /usr/local/bin/start-browser.sh
priority=40
autorestart=true
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; Programs that exhaust their start retries stay FATAL. Stop supervisord so the
; container restart policy (restart: unless-stopped) recovers the whole session.
; The hourly tick renews the generated TLS certificate when it nears expiry.
[eventlistener:watchdog]
command=/usr/bin/python3 -I /opt/wega/supervisor-watchdog.py
events=PROCESS_STATE_FATAL,TICK_3600
priority=1
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
