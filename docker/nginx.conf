worker_processes 1;
pid /run/servo/nginx.pid;
error_log stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /run/servo/client;
    proxy_temp_path /run/servo/proxy;
    fastcgi_temp_path /run/servo/fastcgi;
    uwsgi_temp_path /run/servo/uwsgi;
    scgi_temp_path /run/servo/scgi;
    server {
        listen 7443 ssl;
        ssl_certificate /config/tls/server.crt;
        ssl_certificate_key /config/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /opt/servo/viewer;
        auth_request /_auth;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cache-Control "no-store" always;
        location = /healthz { auth_request off; return 200 "ok\n"; }
        location = /_auth {
            internal;
            auth_request off;
            proxy_pass http://127.0.0.1:6081/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }
        location = /auth/upload {
            client_max_body_size 32m;
            proxy_pass http://127.0.0.1:6081;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location ^~ /auth/ {
            auth_request off;
            client_max_body_size 4k;
            proxy_pass http://127.0.0.1:6081;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location = /login.html { auth_request off; }
        location = /login.js { auth_request off; }
        location = /viewer.css { auth_request off; }
        location = /favicon.png { auth_request off; }
        location = /apple-touch-icon.png { auth_request off; }
        location = / {
            error_page 401 = /login.html;
            try_files /index.html =404;
        }
        location / { try_files $uri $uri/ =404; }
        location /novnc/ { alias /usr/share/novnc/; }
        location ~ (^|/)\. { return 404; }
        location /downloads/ {
            alias /config/Downloads/;
            autoindex on;
            autoindex_format json;
            types { }
            default_type application/octet-stream;
            add_header Content-Disposition attachment always;
            add_header Cache-Control "private, no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        }
        location = /websockify {
            if ($http_origin != "https://$http_host") { return 403; }
            proxy_pass http://127.0.0.1:6080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }
}
