worker_processes 1;
pid /run/wega/browser/nginx.pid;
error_log stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    # Optional trusted reverse proxies (WEGA_TRUSTED_PROXIES), rendered by the
    # entrypoint; without it, $remote_addr is the direct TCP peer.
    include /run/wega/browser/nginx-*.conf;
    client_body_temp_path /run/wega/browser/client;
    proxy_temp_path /run/wega/browser/proxy;
    fastcgi_temp_path /run/wega/browser/fastcgi;
    uwsgi_temp_path /run/wega/browser/uwsgi;
    scgi_temp_path /run/wega/browser/scgi;
    server {
        listen 7443 ssl;
        ssl_certificate /config/tls/server.crt;
        ssl_certificate_key /config/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /opt/wega/viewer;
        auth_request /_auth;
        # Viewer pages use only same-origin module scripts and stylesheets; noVNC
        # sets cursors from data: URLs. wss://$http_host keeps the WebSocket
        # same-origin for browsers whose 'self' does not cover wss:.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' wss://$http_host; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store" always;
        location = /healthz { auth_request off; return 200 "ok\n"; }
        location = /_auth {
            internal;
            auth_request off;
            proxy_pass http://unix:/run/wega/auth/auth.sock:/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }
        location = /auth/upload {
            client_max_body_size 32m;
            proxy_pass http://unix:/run/wega/auth/auth.sock:;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location ^~ /auth/ {
            auth_request off;
            client_max_body_size 4k;
            proxy_pass http://unix:/run/wega/auth/auth.sock:;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location = /login.html { auth_request off; }
        location = /login.js { auth_request off; }
        location = /viewer.css { auth_request off; }
        location = /favicon.png { auth_request off; }
        location = /apple-touch-icon.png { auth_request off; }
        location = / {
            error_page 401 = /login.html;
            try_files /index.html =404;
        }
        location / { try_files $uri $uri/ =404; }
        location /novnc/ { alias /usr/share/novnc/; }
        location ~ (^|/)\. { return 404; }
        location /downloads/ {
            alias /config/Downloads/;
            # The browser UID writes here; never follow links out of the folder.
            disable_symlinks on;
            autoindex on;
            autoindex_format json;
            types { }
            default_type application/octet-stream;
            add_header Content-Disposition attachment always;
            add_header Cache-Control "private, no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        }
        location = /websockify {
            if ($http_origin != "https://$http_host") { return 403; }
            # Unix socket: pages running in this container can reach loopback
            # TCP ports, but not this unauthenticated bridge.
            proxy_pass http://unix:/run/wega/auth/websocket.sock:;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }
}
