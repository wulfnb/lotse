<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" sizes="64x64" href="/favicon.png"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"><title>Lotse Browser</title><link rel="stylesheet" href="/viewer.css"></head>
<body><header><strong class="brand"><img src="/favicon.png" alt="" width="22" height="22">Lotse</strong><span id="status" role="status">Connecting…</span><div class="actions"><button id="account">Account</button><button id="signout">Sign out</button><button id="downloads">Downloads</button><button id="clipboard">Clipboard</button><button id="fullscreen">Full screen</button><button id="reconnect" hidden>Reconnect</button></div></header><main id="screen" aria-label="Remote Lotse browser"></main>
<dialog id="account-dialog"><h2>Account settings</h2><p>Change the username and password for this web browser.</p><form id="account-form"><label>Username<input name="username" autocomplete="username" maxlength="64" pattern="[A-Za-z0-9][A-Za-z0-9_.@-]{0,63}" required></label><label>Current password<input name="current_password" type="password" autocomplete="current-password" required></label><label>New password<input name="password" type="password" autocomplete="new-password" minlength="12" required></label><label>Confirm new password<input name="confirm_password" type="password" autocomplete="new-password" minlength="12" required></label><p id="account-notice" role="status" aria-live="polite"></p><p class="hint">Saving signs out other sessions and reconnects browser controls.</p><div><button id="close-account" type="button">Cancel</button><button type="submit">Save changes</button></div></form></dialog>
<dialog id="downloads-dialog"><h2>Completed downloads</h2><p>Save files from the remote browser to this computer.</p><p id="downloads-notice" role="status"></p><ul id="downloads-list"></ul><div class="download-actions"><button id="refresh-downloads">Refresh</button><button id="close-downloads">Close</button></div></dialog>
<dialog id="clipboard-dialog"><form method="dialog"><h2>Clipboard</h2><label for="clipboard-text">Copy text from the browser, or paste text to send to it.</label><textarea id="clipboard-text" rows="7" spellcheck="false"></textarea><div><button type="button" id="send-clipboard">Send to browser</button><button>Close</button></div></form></dialog><script type="module" src="/viewer.js"></script></body></html>
